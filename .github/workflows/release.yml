name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Iconic.zip
        shell: pwsh
        run: |
          $out = 'Share\Iconic'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet publish src/Iconic.csproj -c Release -o $out --nologo --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=false
          Copy-Item 'share-template\Install Iconic.cmd' $out
          Copy-Item 'share-template\Read Me.txt' $out
          Compress-Archive -Path $out -DestinationPath 'Share\Iconic.zip' -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $tag = '${{ inputs.version }}' } else { $tag = '${{ github.ref_name }}' }
          gh release create $tag 'Share\Iconic.zip' --title "Iconic $tag" --generate-notes
